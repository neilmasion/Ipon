<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pinkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4F81"/>
      <stop offset="100%" stop-color="#E63E6F"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#FF4F81" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="20" fill="#FFF5F8" stroke="#FFE4EC" stroke-width="2"/>
  <!-- Pink Peso Sign (Philippine Peso ₱) -->
  <text x="32" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#pinkGradient)" text-anchor="middle" filter="url(#softGlow)">₱</text>
</svg>
